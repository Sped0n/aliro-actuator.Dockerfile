x-image: &image
  image: aliro-actuator:local
  pull_policy: never

services:
  nfc:
    <<: *image
    profiles: [nfc]
    command: ["-m", "examples.nfc.user_device"]
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Docker's default AppArmor profile blocks writes to the GPIO attributes.
      - apparmor=unconfined
    devices:
      - /dev/i2c-1:/dev/i2c-1:rw
    volumes:
      - type: bind
        source: /sys/class/gpio/gpio23
        target: /sys/class/gpio/gpio23
        bind: {create_host_path: false}
      - type: bind
        source: /sys/class/gpio/gpio24
        target: /sys/class/gpio/gpio24
        bind: {create_host_path: false}
      - type: bind
        source: /sys/class/gpio/gpio25
        target: /sys/class/gpio/gpio25
        bind: {create_host_path: false}

  ble-uwb:
    <<: *image
    profiles: [ble-uwb]
    command: ["-m", "examples.ble.user_device_ble_uwb"]
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0:rw
