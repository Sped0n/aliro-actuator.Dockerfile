x-image: &image
  image: aliro-actuator:local
  pull_policy: never

services:
  nfc:
    <<: *image
    profiles: [nfc]
    command: ["-m", "examples.nfc.user_device"]
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/i2c-1:/dev/i2c-1:rw
      - /dev/gpiochip0:/dev/gpiochip0:rw

  ble-uwb:
    <<: *image
    profiles: [ble-uwb]
    command: ["-m", "examples.ble.user_device_ble_uwb"]
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0:rw
